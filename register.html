<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 80%;
        }
        a {
            display: block;
            margin: 10px;
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>إنشاء حساب جديد</h1>
        <form>
            <input type="text" placeholder="رقم الهاتف أو الإيميل" required>
            <input type="password" placeholder="كلمة السر" required>
            <input type="password" placeholder="تأكيد كلمة السر" required>
            <button type="submit">تسجيل</button>
        </form>
        <a href="index.html">عودة إلى تسجيل الدخول</a>
    </div>
</body>
</html>
